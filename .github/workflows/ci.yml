name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate extension.toml parses
        run: |
          python3 - <<'PY'
          import re, tomllib, sys
          with open("extension.toml", "rb") as f:
              data = tomllib.load(f)
          for key in ("id", "name", "version", "schema_version"):
              assert key in data, f"extension.toml missing required key: {key}"
          grammars = data.get("grammars", {})
          assert "sema" in grammars, "extension.toml missing [grammars.sema]"
          commit = grammars["sema"].get("commit", "")
          assert re.fullmatch(r"[0-9a-f]{40}", commit), "grammars.sema.commit must be a full commit SHA"
          word_characters = set(tomllib.load(open("languages/sema/config.toml", "rb"))["word_characters"])
          assert {"&", "%", "^", "~", "."} <= word_characters
          for path in ("languages/sema/highlights.scm",):
              query = open(path).read()
              for name in ("bytes/length", "async/with-timeout", "path/canonicalize", "db/open", "workflow/mcp-handle"):
                  assert f'"{name}"' in query, f"{path} missing {name}"
              assert '"with-budget"' not in query, f"{path} contains obsolete with-budget"
              assert '"llm/with-budget"' in query, f"{path} missing llm/with-budget"
          print("extension.toml OK:", data["id"], data["version"])
          PY

      - name: Check language query files are present
        run: |
          set -e
          required="config.toml highlights.scm brackets.scm indents.scm outline.scm textobjects.scm runnables.scm injections.scm overrides.scm redactions.scm"
          missing=0
          for f in $required; do
            if [ ! -f "languages/sema/$f" ]; then
              echo "::error::missing languages/sema/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "all query files present"

  build:
    name: Build extension (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt
      - name: Build the Rust extension (DAP + MCP)
        run: cargo build --release --target wasm32-wasip1
      - name: Check formatting
        run: cargo fmt --check
